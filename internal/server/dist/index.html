<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autoscale Arcade — server</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; background: #0b1020; color: #e6e8ef; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 56rem; margin: 4rem auto; padding: 0 1.5rem; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; }
  code, pre { background: #141a33; border-radius: .4rem; padding: .1rem .4rem; }
  pre { padding: 1rem; overflow: auto; max-height: 60vh; }
  a { color: #8ab4f8; }
  .muted { color: #9aa3b8; }
</style>
</head>
<body>
<main>
  <h1>🕹️ Autoscale Arcade</h1>
  <p class="muted">The arcade-server is running, but this binary was built without the web UI
    (<code>web/dist</code> is copied to <code>internal/server/dist</code> at build time).</p>
  <p>Useful endpoints: <a href="/api/state">/api/state</a> · <a href="/api/scenarios">/api/scenarios</a> ·
    <a href="/api/leaderboard">/api/leaderboard</a> · <a href="/metrics">/metrics</a> · <a href="/healthz">/healthz</a> · <code>/ws</code></p>
  <pre id="out">connecting to /ws…</pre>
</main>
<script>
  const out = document.getElementById('out');
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type !== 'snapshot') return;
    const s = m.state;
    out.textContent = JSON.stringify({ ts: s.ts, cluster: s.cluster.name, nodes: s.nodes.length, pods: s.pods.length,
      autoscaler: s.cluster.autoscaler.status, scenario: s.scenario, cabinets: s.cabinets }, null, 2);
  };
  ws.onclose = () => { out.textContent += '\n(disconnected)'; };
</script>
</body>
</html>

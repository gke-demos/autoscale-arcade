# Spot On — Workload Class Spot placement with an On-Demand / Spot ratio
# (two plain node pools: spot-spot = n4d Spot, spot-od = n4 on-demand).
# Needs the stockout lever (docs/cabinets/spot-on.md). Full run ≈ 7–9 min.
name: spot
cabinet: spot
title: "Spot On"
steps:
  - caption: "Spot On. Ten checkout pods. The Workload Class says: 80 percent on Spot, fall back to On-Demand if Spot runs out."
    wait: 5s
  - caption: "{{ .counts.spot }} on Spot, {{ .counts.onDemand }} On-Demand. The webhook placed each pod to hit the ratio. Cost now: ${{ printf \"%.2f\" .costPerHour.current }} an hour."
    wait: 6s
  - caption: "Dial it down to 50 percent. Half the pods move to On-Demand — a rolling replacement, not a redeploy."
    action: { name: spot.ratio, spotRatio: 50 }
    waitFor: { path: "counts.onDemand", gte: 5, timeout: 240s }
    onTimeout: continue
  - caption: "{{ .counts.spot }} Spot, {{ .counts.onDemand }} On-Demand. Now all the way to 100 percent Spot."
    action: { name: spot.ratio, spotRatio: 100 }
    waitFor: { path: "counts.spot", gte: 10, timeout: 240s }
    onTimeout: continue
  - caption: "All ten on Spot. Now a stockout: Spot capacity disappears."
    action: { name: spot.stockout, enabled: true }
    waitFor: { path: "inFallback", truthy: true, timeout: 300s }
    onTimeout: continue
  - caption: "Fallback. Pods are running On-Demand and the Workload Class reports InFallback. Nobody paged."
    wait: 8s
  - caption: "Spot comes back. Active reversion evicts the fallback pods one by one, back onto Spot."
    action: { name: spot.stockout, enabled: false }
    waitFor: { path: "inFallback", truthy: false, timeout: 300s }
    onTimeout: continue
  - caption: "Reverted. {{ .counts.spot }} pods on Spot again. Back to the 80 percent default."
    action: { name: spot.ratio, spotRatio: 80 }
    wait: 6s

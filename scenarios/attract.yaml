# Attract mode: loop every cabinet while nobody is at the pedestal, resetting
# each cabinet to its start state before and after its turn. Fast, visual
# cabinets first so a passer-by sees something within two minutes.
name: attract
title: "Attract mode"
cabinets: [teleporter, nitro, lights, absorber, spot, climber]
loop: true
resetBetween: true

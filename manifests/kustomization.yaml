# Everything the arcade needs on the cluster, in apply order.
# `kubectl apply -k manifests/` (or `make deploy`). Addons (cert-manager,
# workload-class, pod-migration) come from hack/cluster.sh, not from here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-platform
  - 01-climber
  - 02-spot
  - 03-teleporter
  - 04-absorber
  - 05-lights
  - 06-nitro
  - 90-gateway

# Backend policies for Service/arcade-server.
#
# IAP: Uses the custom OAuth 2.0 client in gke-demos-345619 so external org
# domains (domain:google.com) can authenticate alongside internal org users
# (domain:gke.ninja). The Google-managed OAuth client (when clientID is omitted)
# restricts logins to the project's own Workspace org (@gke.ninja) only.
#
# Run `./hack/iap.sh oauth` to create Secret/arcade-iap-oauth (key `key`) and
# bind domain:google.com + domain:gke.ninja on the IAP backend service.
#
# timeoutSec 3600 keeps the /ws WebSocket open for an hour (the kiosk reconnects anyway).
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: arcade-server
  namespace: arcade-system
  labels:
    app.kubernetes.io/part-of: autoscale-arcade
    arcade.gke.io/cabinet: system
spec:
  targetRef:
    group: ""
    kind: Service
    name: arcade-server
  default:
    timeoutSec: 3600
    connectionDraining:
      drainingTimeoutSec: 10
    logging:
      enabled: true
      sampleRate: 1000000
    iap:
      enabled: true
      clientID: 1067056737933-r26t9bsnmgq3ht0v6284p6tulh63bsp9.apps.googleusercontent.com
      oauth2ClientSecret:
        name: arcade-iap-oauth
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: arcade-server
  namespace: arcade-system
  labels:
    app.kubernetes.io/part-of: autoscale-arcade
    arcade.gke.io/cabinet: system
spec:
  targetRef:
    group: ""
    kind: Service
    name: arcade-server
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /healthz

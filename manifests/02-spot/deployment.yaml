# Deployment/checkout: 10 pause-sized pods (80 % => 8 Spot / 2 on-demand).
# The pods pin themselves to the cabinet's two node pools (label
# arcade.demo/cabinet=spot, taint arcade.demo/spot-cabinet); the
# workload-class webhook adds the Spot / on-demand node affinity per pod to
# realise the ratio, plus the gke-spot taint toleration for the Spot share.
# No ComputeClass here on purpose — see spot-placement-policy.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: arcade-spot
  labels:
    app.kubernetes.io/part-of: autoscale-arcade
    arcade.gke.io/cabinet: spot
    app: checkout
spec:
  replicas: 10
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        app.kubernetes.io/part-of: autoscale-arcade
        arcade.gke.io/cabinet: spot
        arcade.gke.io/workload: checkout
    spec:
      terminationGracePeriodSeconds: 5
      nodeSelector:
        arcade.demo/cabinet: spot
      tolerations:
        - key: arcade.demo/spot-cabinet
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: checkout
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 64Mi

# Infrastructure profile for the Spot On cabinet. Deliberately NO
# customComputeClass: the workload-class webhook expresses the on-demand share
# as a required cloud.google.com/gke-spot node-affinity term, and GKE Warden
# rejects that key on any pod that also selects a ComputeClass
# ("ccc-node-affinity-selector-limitation", verified 2026-11-02). The cabinet
# therefore runs on two plain node pools created by hack/cluster.sh
# (spot-spot: n4d-standard-2 Spot, spot-od: n4-standard-2 on-demand; both
# labelled arcade.demo/cabinet=spot, tainted arcade.demo/spot-cabinet) that
# Deployment/checkout selects itself.
# Active reversion with no minimum dwell time so the "capacity returns" beat
# of the demo is visible within seconds.
apiVersion: workloads.gke.io/v1
kind: GKESpotPlacementPolicy
metadata:
  name: arcade-spot
  labels:
    app.kubernetes.io/part-of: autoscale-arcade
    arcade.gke.io/cabinet: spot
spec:
  reversion:
    action: Active
    minDurationOnFallback: 0s

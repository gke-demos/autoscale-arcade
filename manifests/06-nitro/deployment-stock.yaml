# Deployment/stock: the unboosted lane. 250m CPU request == limit, ~20 s of
# single-core warm-up before /ready, so it takes ~80 s to become Ready.
# Keep this template byte-identical to deployment-nitro.yaml (except names).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
  namespace: arcade-nitro
  labels:
    app.kubernetes.io/part-of: autoscale-arcade
    arcade.gke.io/cabinet: nitro
    app: stock
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stock
  template:
    metadata:
      labels:
        app: stock
        app.kubernetes.io/part-of: autoscale-arcade
        arcade.gke.io/cabinet: nitro
        arcade.gke.io/workload: stock
        arcade.gke.io/lane: stock
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: racer
          image: us-central1-docker.pkg.dev/gke-demos-345619/autoscale-arcade/arcade:latest
          args: ["worker", "--mode=race"]
          env:
            - name: WARMUP_CPU_SECONDS
              value: "20"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi

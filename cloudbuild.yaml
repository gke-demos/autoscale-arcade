# Cloud Build: build the single arcade image with BuildKit and push it to
# Artifact Registry. Used by `make image` (no local docker needed):
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_IMAGE=us-central1-docker.pkg.dev/$PROJECT_ID/autoscale-arcade/arcade,_TAG=latest,_REV=$(git rev-parse --short HEAD)
#
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/autoscale-arcade/arcade
  _TAG: latest
  _REV: local
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --build-arg
      - VERSION=${_TAG}-${_REV}
      - --tag
      - ${_IMAGE}:${_TAG}
      - --tag
      - ${_IMAGE}:${_REV}
      - .
# Listed images are pushed by Cloud Build after the steps succeed and their
# digests appear in the build result.
images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:${_REV}
